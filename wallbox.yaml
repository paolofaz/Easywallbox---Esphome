    unit_of_measurement: "A"
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    name: "Control Pilot Voltage"
    id: wallbox_pilot_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    name: "Safe Current Limit"
    id: wallbox_safe_limit
    unit_of_measurement: "A"
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    name: "Charging Current"
    id: wallbox_current
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt"

  - platform: template
    name: "Charging Power"
    id: wallbox_power
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    icon: "mdi:lightning-bolt"

  - platform: template
    name: "House total power -DPM-"
    id: wallbox_house_load
    unit_of_measurement: "kW"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt"

  - platform: template
    name: "Session Energy"
    id: wallbox_session_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt-circle"

  - platform: template
    name: "Session Duration"
    id: wallbox_charge_minutes
    unit_of_measurement: "min"
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    device_class: duration

  - platform: template
    name: "Power set"
    id: wallbox_power_set
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    icon: "mdi:lightning-bolt"

